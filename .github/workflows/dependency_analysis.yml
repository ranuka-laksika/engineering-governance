# SECURITY: Uses pull_request_target; do not checkout or execute PR code in this workflow.
# Keep permissions: {} exactly as-is. Avoid adding actions/checkout here in the future.
name: Claude Code • Dependency Analysis

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'dependency-registry/go.yaml'

permissions: {}

jobs:
  analyze-dependencies:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository base (for trusted system prompt)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Prepare system prompt with environment variables
        id: prepare_prompt
        run: |
          # Install envsubst if not available
          if ! command -v envsubst &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gettext-base
          fi

          # Set environment variables
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          export REPOSITORY="${{ github.repository }}"

          # Substitute variables in system prompt from trusted base
          SYSTEM_PROMPT=$(envsubst < ${{ github.workspace }}/.github/claude/system_prompt.txt)

          # Save to GitHub environment
          echo "SYSTEM_PROMPT<<EOF" >> $GITHUB_ENV
          echo "$SYSTEM_PROMPT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run Claude Dependency Analysis
        id: run_claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.DEPENDENCY_CHECKER_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ env.SYSTEM_PROMPT }}
          track_progress: false
          use_sticky_comment: false
          claude_args: |
            --allowedTools "WebFetch,WebSearch,mcp__github__get_pull_request,mcp__github__get_file_contents,Read"
            --model claude-haiku-4-5-20251001

      - name: Post analysis report as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.run_claude.outputs.execution_file }}
        run: |
          set -euo pipefail

          # Extract the agent's final text output from the execution log.
          # The log may be a JSON array or newline-delimited JSON, so normalize first,
          # then take the final `result` message (fallback: last assistant text block).
          REPORT=""
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            REPORT=$(jq -rs '
              (if (.[0] | type) == "array" then .[0] else . end) as $events
              | ( [ $events[] | select(.type == "result")    | .result ] | last )
                // ( [ $events[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text ] | last )
                // empty
            ' "$EXECUTION_FILE" || true)
          fi

          # Fall back to a failure notice if the agent produced no usable report.
          if [ -z "$REPORT" ]; then
            REPORT=$'<!-- dependency-analysis-report -->\n⚠️ Dependency analysis could not be completed.\n\nThe analysis agent did not produce a report. Check the workflow run logs for details.'
          fi

          # Always post a NEW comment on the PR with the captured report.
          printf '%s' "$REPORT" > "$RUNNER_TEMP/dependency-report.md"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/dependency-report.md"
